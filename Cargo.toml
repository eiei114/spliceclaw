[package]
name = "spliceclaw"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Search your own Splice Sounds library from the Firefox session"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eiei114/spliceclaw"
readme = "readme.md"
authors = ["eiei114"]
keywords = ["splice", "cli", "firefox", "samples"]
categories = ["command-line-utilities"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "readme.md",
    "license-mit",
    "license-apache",
    "changelog.md",
    "src/**",
]

[[bin]]
name = "spliceclaw"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
